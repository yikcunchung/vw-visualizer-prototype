name: a11y

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  playwright:
    name: axe + keyboard behaviour
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Chromium only: the suite drives real key events and reads the Chrome
      # accessibility tree, and the four projects are viewports of one browser.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the suite
        run: npm test

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
